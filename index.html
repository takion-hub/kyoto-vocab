<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17243b"><title>京大英単語帳</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17243b;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#17243b;color:white;padding:22px 18px}header h1{font-size:1.35rem;margin:0 0 6px}header p{margin:0;color:#d5deeb;font-size:.9rem}.wrap{max-width:900px;margin:auto;padding:16px}.panel{background:white;border:1px solid #e0e5ed;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 7px #10203008}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.search{width:100%;padding:12px;border:1px solid #ccd4e0;border-radius:10px;font-size:1rem;margin-bottom:10px}select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #ccd4e0;background:white;color:inherit}button{cursor:pointer}button.primary{background:#243b62;color:white;border-color:#243b62}button:disabled{opacity:.45;cursor:default}.stats{display:flex;gap:8px}.stat{background:#f3f6fb;border-radius:10px;padding:10px;flex:1;text-align:center;font-size:.85rem}.stat strong{display:block;font-size:1.25rem}.word{padding:13px 2px;border-bottom:1px solid #edf0f4}.word:last-child{border:0}.word h3{margin:0 0 4px;font-size:1.1rem}.word .meaning{font-size:.95rem}.meta{color:#66748a;font-size:.8rem;margin-top:5px}.pill{display:inline-block;background:#edf2fa;border-radius:20px;padding:2px 8px;font-size:.75rem;margin-right:4px}.state{font-size:.8rem}.answer{background:#f2f6fb;padding:12px;border-radius:10px;margin:12px 0;min-height:48px}.hidden{display:none!important}.quizword{font-size:1.6rem;font-weight:700;text-align:center;padding:20px 0}.note{color:#6a7689;font-size:.82rem}.empty{padding:24px;text-align:center;color:#748197}footer{text-align:center;color:#738096;font-size:.75rem;padding:20px}
</style></head><body>
<header><h1>京大英単語帳</h1><p>過去問由来の語彙を整理して、検索・復習・定着をするための学習サイト</p></header>
<main class="wrap">
<div class="panel stats"><div class="stat"><strong id="total">0</strong>収録語</div><div class="stat"><strong id="learned">0</strong>覚えた</div><div class="stat"><strong id="review">0</strong>復習</div></div>
<div class="panel"><input id="search" class="search" placeholder="英単語・意味・派生語で検索"><div class="row"><select id="year"><option value="all">年度：すべて</option></select><select id="state"><option value="all">状態：すべて</option><option value="new">未習</option><option value="review">復習</option><option value="learned">習得</option></select><select id="sort"><option value="alpha">ABC順</option><option value="priority">重要度順</option></select></div></div>
<div class="panel"><div class="row"><button id="listBtn" class="primary">単語一覧</button><button id="quizBtn">一問一答</button></div><section id="list"></section><section id="quiz" class="hidden"><div class="meta" id="qCount"></div><div class="quizword" id="qWord"></div><div class="answer hidden" id="qAnswer"></div><div class="row"><button id="showAnswer" class="primary">答えを見る</button><button id="markReview">復習にする</button><button id="markLearned">覚えた</button></div><div class="row" style="margin-top:10px"><button id="next">次の問題</button></div></section></div>
<p class="note">※現在は動作確認用の仮データです。京大過去問から確認・抽出した本データは、PDFをもとに追加します。学習状態はこのブラウザに保存されます。</p>
<footer>学習状態は端末・ブラウザ内に保存されます。別端末とは自動同期されません。</footer></main>
<script>
const words=[
{id:1,word:'assumption',meaning:'仮定、想定',family:'assume · assumed',years:[2024],priority:'A',frequency:2},
{id:2,word:'appreciate',meaning:'正しく理解する、ありがたく思う',family:'appreciation · appreciative',years:[2024],priority:'A',frequency:2},
{id:3,word:'inevitably',meaning:'必然的に、避けられず',family:'inevitable · inevitability',years:[2023],priority:'B',frequency:1},
{id:4,word:'superficial',meaning:'表面的な、浅薄な',family:'superficially · surface',years:[2023],priority:'B',frequency:1},
{id:5,word:'discriminate',meaning:'区別する、差別する',family:'discrimination · discriminatory',years:[2023],priority:'A',frequency:2},
{id:6,word:'vulnerable',meaning:'傷つきやすい、弱い立場の',family:'vulnerability',years:[2025],priority:'A',frequency:2},
{id:7,word:'perspective',meaning:'視点、見方',family:'perspectival',years:[2025],priority:'A',frequency:2},
{id:8,word:'transform',meaning:'変える、変形させる',family:'transformation · transformative',years:[2022],priority:'A',frequency:2},
{id:9,word:'ecosystem',meaning:'生態系、相互に関係する環境',family:'ecological · ecology',years:[2022],priority:'B',frequency:1},
{id:10,word:'collaborate',meaning:'協力する、共同で取り組む',family:'collaboration · collaborative',years:[2026],priority:'B',frequency:1},
{id:11,word:'forecast',meaning:'予測する；予報',family:'forecaster · forecasting',years:[2026],priority:'B',frequency:1},
{id:12,word:'unique',meaning:'独特の、唯一の',family:'uniquely · uniqueness',years:[2026],priority:'B',frequency:1}
];
const $=s=>document.querySelector(s);let data=JSON.parse(localStorage.getItem('kyotoVocabState')||'{}');function state(w){return data[w.id]||'new'}function save(){localStorage.setItem('kyotoVocabState',JSON.stringify(data));render()}
const yearSel=$('#year');[...new Set(words.flatMap(w=>w.years))].sort((a,b)=>b-a).forEach(y=>{let o=document.createElement('option');o.value=y;o.textContent='年度：'+y;yearSel.append(o)});
function filtered(){let q=$('#search').value.trim().toLowerCase(),yr=$('#year').value,st=$('#state').value;let a=words.filter(w=>(!q||[w.word,w.meaning,w.family].join(' ').toLowerCase().includes(q))&&(yr==='all'||w.years.includes(+yr))&&(st==='all'||state(w)===st));if($('#sort').value==='priority')a.sort((x,y)=>x.priority.localeCompare(y.priority)||x.word.localeCompare(y.word));else a.sort((x,y)=>x.word.localeCompare(y.word));return a}
function render(){let a=filtered();$('#total').textContent=words.length;$('#learned').textContent=words.filter(w=>state(w)==='learned').length;$('#review').textContent=words.filter(w=>state(w)==='review').length;$('#list').innerHTML=a.length?a.map(w=>`<article class="word"><h3>${w.word}</h3><div class="meaning">${w.meaning}</div><div class="meta"><span class="pill">重要度 ${w.priority}</span><span class="pill">頻出目安 ${w.frequency}</span><span class="pill">${w.years.join(', ')}</span><span class="state">状態：${state(w)==='new'?'未習':state(w)==='review'?'復習':'習得'}</span></div><div class="meta">派生・関連：${w.family}</div><div class="row" style="margin-top:8px"><button onclick="setState(${w.id},'review')">復習</button><button onclick="setState(${w.id},'learned')">覚えた</button><button onclick="setState(${w.id},'new')">未習に戻す</button></div></article>`).join(''):'<div class="empty">該当する単語がありません</div>'}
function setState(id,s){data[id]=s;save()}window.setState=setState;
let quizPool=[],quizIndex=0,current=null,shown=false;function startQuiz(){quizPool=filtered().slice().sort(()=>Math.random()-.5);quizIndex=0;nextQ();$('#list').classList.add('hidden');$('#quiz').classList.remove('hidden');$('#listBtn').classList.remove('primary');$('#quizBtn').classList.add('primary')}
function nextQ(){if(!quizPool.length){$('#qWord').textContent='対象単語がありません';$('#qAnswer').textContent='検索・年度・状態フィルターを変更してみてください';$('#qAnswer').classList.remove('hidden');return}if(quizIndex>=quizPool.length){quizPool.sort(()=>Math.random()-.5);quizIndex=0}current=quizPool[quizIndex++];shown=false;$('#qCount').textContent=`${quizIndex} / ${quizPool.length}`;$('#qWord').textContent=current.word;$('#qAnswer').textContent=`${current.meaning}\n派生・関連：${current.family}\n出題年度：${current.years.join(', ')}`;$('#qAnswer').classList.add('hidden');$('#showAnswer').disabled=false}
$('#showAnswer').onclick=()=>{$('#qAnswer').classList.remove('hidden');shown=true;$('#showAnswer').disabled=true};$('#next').onclick=nextQ;$('#markReview').onclick=()=>current&&setState(current.id,'review');$('#markLearned').onclick=()=>current&&setState(current.id,'learned');$('#listBtn').onclick=()=>{$('#quiz').classList.add('hidden');$('#list').classList.remove('hidden');$('#listBtn').classList.add('primary');$('#quizBtn').classList.remove('primary')};$('#quizBtn').onclick=startQuiz;['search','year','state','sort'].forEach(id=>$('#'+id).addEventListener('input',render));render();
</script></body></html>
